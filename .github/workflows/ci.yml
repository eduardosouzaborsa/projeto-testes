name: CI - Testes Automatizados (API e Web UI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  testes-regressivos:
    name: Execução de Testes e Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BASE_URL: https://serverest.dev

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar Dependências
        run: npm ci

      - name: 4. Checagem de Qualidade de Código (ESLint)
        run: npm run lint

      # --- NOVO PASSO ESSENCIAL PARA A WEB UI ---
      - name: 5. Instalar Navegador Chromium no Linux
        run: npx playwright install --with-deps chromium

      # Agora executa tanto os testes de API quanto o teste de Front-end (UI) em modo headless
      - name: 6. Executar Todos os Testes (API + UI)
        run: npm test

      - name: 7. Publicar Relatório de Evidências (Playwright Report)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7